[platformio]
src_dir = firmware/src
include_dir = firmware/include
default_envs = esp32-s3-devkitc-1

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; ESP32-S3-WROOM-1-N16R8: 16MB Flash + 8MB Octal PSRAM
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
build_src_filter = +<*> -<diag.cpp>
build_flags =
  -DBOARD_HAS_PSRAM
  -DCORE_DEBUG_LEVEL=1
  -DBW_USE_LVGL=1
  -DLV_CONF_INCLUDE_SIMPLE
  -DLV_CONF_PATH="${PROJECT_DIR}/firmware/include/lv_conf.h"
  -Wa,-I${PROJECT_DIR}/firmware/src
lib_deps =
  adafruit/Adafruit ST7735 and ST7789 Library
  adafruit/Adafruit GFX Library
  adafruit/Adafruit BusIO
  bblanchon/ArduinoJson @ ^7.2.0
  olikraus/U8g2_for_Adafruit_GFX @ ^1.8.0
  lvgl/lvgl@8.3.11

; LCD + I2C touch + keys + mic wiring probe (English on-screen)
; python -m platformio run -e diag -t upload --upload-port COMx
[env:diag]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
build_src_filter = -<*.cpp> +<diag.cpp>
build_flags =
  -DBOARD_HAS_PSRAM
lib_deps =
  adafruit/Adafruit ST7735 and ST7789 Library
  adafruit/Adafruit GFX Library
  adafruit/Adafruit BusIO
