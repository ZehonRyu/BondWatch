<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="BondWatch" />
  <meta name="theme-color" content="#05060a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>BondWatch</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="stylesheet" href="/watch.css?v=6" />
  <script src="/orient.js?v=2"></script>
</head>
<body>
  <div class="fit">
    <div class="rig">
      <button class="hw pwr" id="pwr" type="button" aria-label="电源">PWR</button>
      <div class="bezel">
        <div class="screen" id="screen">
          <p class="clock" id="clock">00:00</p>
          <span class="orient-badge" id="orient-badge">竖屏</span>
          <canvas id="elf3d"></canvas>
          <div class="elf" id="face">
            <span class="ear left"></span>
            <span class="ear right"></span>
            <span class="spark"></span>
            <div class="head">
              <i></i><i></i>
              <em></em><em></em>
              <b id="mouth"></b>
            </div>
          </div>
          <p class="emo" id="emotion">待机</p>
          <p class="sub" id="subtitle">点屏幕说话</p>
        </div>
      </div>
      <button class="hw ptt" id="ptt" type="button" aria-label="对讲">PTT</button>
      <p class="hint" id="hint">竖屏全身挥手 · 横屏大脸耷拉</p>
      <button class="cam" id="cam" type="button">看 · 手机眼睛</button>
    </div>
  </div>
  <input id="cam-file" type="file" accept="image/*" capture="environment" hidden />
  <script src="/config.js"></script>
  <script type="importmap">
    { "imports": { "three": "/vendor/three.module.js" } }
  </script>
  <script type="module" src="/elf3d.js?v=21"></script>
  <script src="/watch.js?v=5"></script>
</body>
</html>
